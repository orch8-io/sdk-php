name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Packagist is updated by its GitHub webhook once the package has been
# submitted at https://packagist.org/packages/submit — no secret needed here.
jobs:
  release:
    name: Source archive + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: pcntl, posix, json
          coverage: none
          tools: composer:v2
      - name: Test
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/phpunit
      - name: Build source archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          git archive --format=zip --prefix="sdk-php-${version}/" \
            -o "dist/orch8-sdk-php-${version}.zip" "${GITHUB_REF_NAME}"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
